<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EvangeliGO — app gamificado de Teologia Cristã Reformada Calvinista."
    />
    <title>EvangeliGO</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras (T-017, acessibilidade — Libras), mesma integração do app
         legado (dev-pwa-biblia-game/public/game/index.html): widget oficial
         do governo, fora de #root para não ser gerenciado/removido pelo
         React. -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.VLibras) new window.VLibras.Widget("https://vlibras.gov.br/app");
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
