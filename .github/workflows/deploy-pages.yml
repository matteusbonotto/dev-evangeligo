name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: SPA fallback for GitHub Pages
        # GitHub Pages só serve arquivo estático — uma navegação de PÁGINA
        # INTEIRA pra uma rota do React Router (ex.: refresh em /biblia/gen/1,
        # ou o redirect do Google OAuth pra /auth/retorno) não bate em nenhum
        # arquivo real e vira 404 antes do app carregar. Cópia de index.html
        # pra 404.html é o fallback padrão pra SPA em GitHub Pages: o
        # navegador ainda renderiza o app (ignora o status HTTP 404 da
        # navegação), e o React Router resolve a rota certa a partir da URL
        # de verdade assim que o bundle carrega.
        run: cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
